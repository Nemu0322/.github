
name: Check Issue Assignee

on:
  workflow_call:
    inputs:
      task_label:
        type: string
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          TASK_LABEL: ${{ inputs.task_label }}
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const { owner, repo } = context.repo;
            const label = "needs-assignee";
            const taskLabel = process.env.TASK_LABEL;

            if (
              taskLabel &&
              !issue.labels.some(x => x.name === taskLabel)
            ) return;

            if (issue.assignees.length === 0) {
              // ラベルがなければ作成
              try {
                await github.rest.issues.getLabel({
                  owner, repo, name: label
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner, repo,
                  name: label,
                  color: "FBCA04"
                });
              }

              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: issue.number,
                labels: [label]
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo,
                  issue_number: issue.number,
                  name: label
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
